<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>銷售數據動態切換儀表板</title>
    <!-- 引入 Chart.js 互動圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; text-align: center; }
        h1 { color: #2c3e50; }
        .btn-container { margin: 20px 0; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 0 5px; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        button.active { background-color: #e67e22; }
        .badge { background-color: #2ecc71; color: white; padding: 6px 12px; border-radius: 4px; font-size: 14px; }
        .chart-box { width: 80%; max-width: 800px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>銷售數據分析儀表板</h1>
    <p>目前展示資料來源：<span id="currentSource" class="badge">更新版銷售數據 (sales_updated_300)</span></p>
    
    <div class="btn-container">
        <button id="btnUpdated" class="active" onclick="switchData('updated')">切換至更新版數據</button>
        <button id="btnOriginal" onclick="switchData('original')">切換至原始版數據</button>
    </div>

    <div class="chart-box">
        <h3>每日淨銷售額折線圖</h3>
        <canvas id="dailyChart"></canvas>
    </div>

    <div class="chart-box">
        <h3>各商品淨銷售額長條圖</h3>
        <canvas id="productChart"></canvas>
    </div>

    <script>
        const dataUpdated = {"dates": ["2026-09-01", "2026-09-02", "2026-09-03", "2026-09-04", "2026-09-05", "2026-09-06", "2026-09-07", "2026-09-08", "2026-09-09", "2026-09-10", "2026-09-11", "2026-09-12", "2026-09-13", "2026-09-14", "2026-09-15", "2026-09-16", "2026-09-17", "2026-09-18", "2026-09-19", "2026-09-20", "2026-09-21", "2026-09-22", "2026-09-23", "2026-09-24", "2026-09-25", "2026-09-26", "2026-09-27", "2026-09-28", "2026-09-29", "2026-09-30"], "daily_rev": [122700, 130750, 122500, 109250, 138100, 133750, 132650, 145150, 126600, 149250, 142000, 128350, 148400, 131350, 138700, 132200, 118600, 138750, 122700, 130750, 122500, 109250, 138100, 133750, 132650, 145150, 126600, 149250, 142000, 128350], "products": ["USB集線器", "充電器", "手機支架", "機械鍵盤", "無線滑鼠", "筆電支架", "網路攝影機", "藍牙喇叭", "藍牙耳機", "行動電源"], "prod_rev": [382200, 293300, 129300, 698400, 297000, 340800, 382800, 513000, 550800, 382500], "categories": ["影音設備", "行動配件", "電腦周邊"], "cat_rev": [1446600, 805100, 1718400]};
        const dataOriginal = {"dates": ["2026-09-01", "2026-09-02", "2026-09-03", "2026-09-04", "2026-09-05", "2026-09-06", "2026-09-07", "2026-09-08", "2026-09-09", "2026-09-10", "2026-09-11", "2026-09-12", "2026-09-13", "2026-09-14", "2026-09-15", "2026-09-16", "2026-09-17", "2026-09-18", "2026-09-19", "2026-09-20", "2026-09-21", "2026-09-22", "2026-09-23", "2026-09-24", "2026-09-25", "2026-09-26", "2026-09-27", "2026-09-28", "2026-09-29", "2026-09-30"], "daily_rev": [97600, 105650, 97400, 84150, 113000, 108650, 107550, 120050, 101500, 124150, 116900, 103250, 123300, 106250, 113600, 107100, 93500, 113650, 97600, 105650, 97400, 84150, 113000, 108650, 107550, 120050, 101500, 124150, 116900, 103250], "products": ["USB集線器", "充電器", "手機支架", "機械鍵盤", "無線滑鼠", "筆電支架", "網路攝影機", "藍牙喇叭", "藍牙耳機", "行動電源"], "prod_rev": [226200, 230300, 102300, 410400, 177000, 268800, 382800, 513000, 604800, 301500], "categories": ["影音設備", "行動配件", "電腦周邊"], "cat_rev": [1500600, 634100, 1082400]};

        let currentData = dataUpdated;

        // 初始化圖表
        const ctxDaily = document.getElementById('dailyChart').getContext('2d');
        const ctxProduct = document.getElementById('productChart').getContext('2d');

        let dailyChart = new Chart(ctxDaily, {
            type: 'line',
            data: {
                labels: currentData.dates,
                datasets: [{
                    label: '淨銷售額 (NTD)',
                    data: currentData.daily_rev,
                    borderColor: '#3498db',
                    backgroundColor: 'rgba(52, 152, 219, 0.1)',
                    fill: true,
                    tension: 0.1
                }]
            }
        });

        let productChart = new Chart(ctxProduct, {
            type: 'bar',
            data: {
                labels: currentData.products,
                datasets: [{
                    label: '淨銷售額 (NTD)',
                    data: currentData.prod_rev,
                    backgroundColor: '#1abc9c'
                }]
            },
            options: { indexAxis: 'y' }
        });

        function switchData(type) {
            const sourceSpan = document.getElementById('currentSource');
            const btnUpdated = document.getElementById('btnUpdated');
            const btnOriginal = document.getElementById('btnOriginal');

            if (type === 'updated') {
                currentData = dataUpdated;
                sourceSpan.innerText = "更新版銷售數據 (sales_updated_300)";
                btnUpdated.classList.add('active');
                btnOriginal.classList.remove('active');
            } else {
                currentData = dataOriginal;
                sourceSpan.innerText = "原始版銷售數據 (sales_original_300)";
                btnOriginal.classList.add('active');
                btnUpdated.classList.remove('active');
            }

            // 更新折線圖資料
            dailyChart.data.labels = currentData.dates;
            dailyChart.data.datasets[0].data = currentData.daily_rev;
            dailyChart.update();

            // 更新長條圖資料
            productChart.data.labels = currentData.products;
            productChart.data.datasets[0].data = currentData.prod_rev;
            productChart.update();
        }
    </script>
</body>
</html>
