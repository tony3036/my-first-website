name: Run Stock Bot

on:
  workflow_dispatch: # 讓你可以手動在網頁上按按鈕立刻執行
  schedule:
    - cron: '0 9 * * *' # 每天固定時間執行（可依需求調整）

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: |
          python test1.py
