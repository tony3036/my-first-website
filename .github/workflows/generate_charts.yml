name: Auto Generate Sales Charts

on:
  push:
    branches:
      - main
    paths:
      - 'sales_updated_300.csv'
      - 'sales_original_300.csv'
      - 'main.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Chinese Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run Python script
        run: |
          python main.py

      - name: Commit and push generated charts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chart_1_daily_revenue.png chart_2_product_revenue.png chart_3_category_share.png index.html
          git commit -m "chore: auto-generate charts and index.html via GitHub Actions" || exit 0
          git pull --rebase origin main
          git push
