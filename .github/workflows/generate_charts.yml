name: Auto Generate Sales Charts

on:
  workflow_dispatch: # 讓您可以隨時在 GitHub 網頁手動按鈕觸發
  push:
    branches:
      - main
    paths:
      - 'sales_updated_300.csv'
      - 'main.py'

# 賦予 GitHub Actions 寫入與推送程式碼的權限
permissions:
  contents: write

jobs:
  build-charts:
    runs-on: ubuntu-latest
    steps:
      # 1. 下載您的專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝 requirements.txt 裡的套件 (pandas, matplotlib, seaborn 等)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 執行 Python 腳本來自動產生圖表
      - name: Run Python script
        run: |
          python main.py

      # 5. 自動把產生的新圖片 Commit 並 Push 回 GitHub 倉庫
      - name: Commit and push generated charts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.png
          # 檢查是否有變更，有變更才進行 commit 與 push
          git diff --staged --quiet || (git commit -m "chore: auto-generate sales charts via GitHub Actions" && git push)
